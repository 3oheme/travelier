<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#000"/>
  <!-- Left slab serif block -->
  <rect x="2" y="6" width="5" height="6" fill="#fff"/>
  <!-- Right slab serif block -->
  <rect x="25" y="6" width="5" height="6" fill="#fff"/>
  <!-- Crossbar center -->
  <rect x="7" y="7" width="18" height="4" fill="#fff"/>
  <!-- Italic stem (parallelogram: top shifted right, bottom shifted left) -->
  <polygon points="13,11 19,11 16,25 10,25" fill="#fff"/>
  <!-- Underline bar -->
  <rect x="6" y="27" width="20" height="3" fill="#fff"/>
</svg>
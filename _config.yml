title: Travelier
description: Ambient sounds from real-world places to help you focus.
url: "https://travelier.app"
baseurl: ""

collections:
  places:
    output: true
    permalink: /places/:name/

defaults:
  - scope:
      path: ""
      type: places
    values:
      layout: place

plugins:
  - jekyll-sitemap

worker_url: "https://travelier.app"

# Base URL for audio files served from Cloudflare R2.
# Set to your R2 bucket public URL (no trailing slash), e.g.:
#   https://pub-<hash>.r2.dev
#   https://audio.travelier.app   ← custom domain on the bucket
# Leave empty to fall back to local /assets paths (local dev only).
r2_audio_base: "https://audio.travelier.app"

exclude:
  - specs/
  - scripts/
  - worker/
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - assets/places/*/track.mp3

{% if fc_preview.size > 0 %}
<section class="collection-banner">
  <div class="collection-banner__photos" aria-hidden="true">
    {% for p in fc_preview %}
    <div class="collection-banner__thumb">
      <img src="{{ p.images.thumb }}" alt="" width="600" height="450" loading="lazy">
    </div>
    {% endfor %}
  </div>
  <div class="collection-banner__text">
    <span class="collection-banner__label">Collection</span>
    <p class="collection-banner__title">{{ fc.title }}</p>
    <p class="collection-banner__tagline">{{ fc.tagline }}</p>
    <a href="/tags/{{ fc.tag }}/" class="btn collection-banner__btn">{{ fc_count }} places &rarr;</a>
  </div>
</section>
{% endif %}
